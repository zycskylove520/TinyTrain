# =====================================
# 人脸识别模型: YOLOv11_FaceNet 模型配置文件
# =====================================

name: YOLOv11_FaceNet
scale: n

# model_config compound scaling constants
scales:
  n: { depth: 0.5, summary: "186 layers, 19892096 parameters, 19892096 gradients, 1.52 GFLOPs, for a 112×112 input." }
  s: { depth: 1.0, summary: "268 layers, 95771520 parameters, 95771520 gradients, 7.46 GFLOPs, for a 112×112 input." }
  m: { depth: 1.5, summary: "872 layers, 379552704 parameters, 379552704 gradients, 31.09 GFLOPs, for a 112×112 input." }

# model network struct
network:
  - { type: entry, from: [ -1 ], module: CBA, repeat: 1, args: { in_channels: 3, out_channels: 32, kernel_size: 3, stride: 2 } } # 0-P1/2
  - { type: flow, from: [ -1 ], module: CBA, repeat: 1, args: { in_channels: 32, out_channels: 64, kernel_size: 3, stride: 2 } } # 1-P2/4
  - { type: flow, from: [ -1 ], module: C3k2, repeat: 1, args: { in_channels: 64, out_channels: 128, n: 2, c3k: False, hidden_channels: 0.25 } } # 2
  - { type: flow, from: [ -1 ], module: CBA, repeat: 1, args: { in_channels: 128, out_channels: 128, kernel_size: 3, stride: 2 } } # 3-P3/8
  - { type: flow, from: [ -1 ], module: C3k2, repeat: 1, args: { in_channels: 128, out_channels: 256, n: 2, c3k: False, hidden_channels: 0.25 } } # 4
  - { type: flow, from: [ -1 ], module: CBA, repeat: 1, args: { in_channels: 256, out_channels: 256, kernel_size: 3, stride: 2 } } # 5-P4/16
  - { type: flow, from: [ -1 ], module: C3k2, repeat: 1, args: { in_channels: 256, out_channels: 256, n: 2, c3k: True, hidden_channels: 0.5 } } # 6
  - { type: flow, from: [ -1 ], module: CBA, repeat: 1, args: { in_channels: 256, out_channels: 512, kernel_size: 3, stride: 2 } } # 7-P5/32
  - { type: flow, from: [ -1 ], module: C3k2, repeat: 1, args: { in_channels: 512, out_channels: 512, n: 2, c3k: True, hidden_channels: 0.5 } } # 8
  - { type: flow, from: [ -1 ], module: C2PSA, repeat: 1, args: { in_channels: 512, out_channels: 512 } } # 9
  - { type: head, from: [ -1 ], module: GeneralFaceHead, repeat: 1, args: { in_channels: 512, embedding_size: 512 } } # 10
