# =================================
# 人脸识别模型: ResNet-face 模型配置文件
# =================================

name: ResFaceNet
scale: n

# model_config compound scaling constants
scales:
  n: { depth: 1, summary: "Use ResNet18, 155 layers, 8231360 parameters, 8231360 gradients, 2.57 GFLOPs, for a 112×112 input" }
  s: { depth: 1, summary: "Use ResNet34, 267 layers, 14415168 parameters, 14415168 gradients, 4.85 GFLOPs, for a 112×112 input." }
  m: { depth: 1, summary: "Use ResNet50, 379 layers, 20194624 parameters, 20194624 gradients, 7.11 GFLOPs, for a 112×112 input." }
  l: { depth: 1, summary: "Use ResNet100, 729 layers, 33382464 parameters, 33382464 gradients, 14.21 GFLOPs, for a 112×112 input." }
  x: { depth: 1, summary: "Use ResNet200, 1415 layers, 66204608 parameters, 66204608 gradients, 28.12 GFLOPs, for a 112×112 input." }

# model network struct
network:
  - { type: entry, from: [ -1 ], module: CBA, repeat: 1,  args: { in_channels: 3, out_channels: 64, kernel_size: 3, stride: 1, padding: 1, act: False } } # 0
  - { type: flow, from: [ -1 ], module: ResNetLayer, repeat: 1, args: { in_channels: 64, out_channels: 64, stride: 2, is_first: False, e: 1, n: 2 } } # 1-P1/2
  - { type: flow, from: [ -1 ], module: ResNetLayer, repeat: 1, args: { in_channels: 64, out_channels: 128, stride: 2, is_first: False, e: 1, n: 2 } } # 2-P2/4
  - { type: flow, from: [ -1 ], module: ResNetLayer, repeat: 1, args: { in_channels: 128, out_channels: 256, stride: 2, is_first: False, e: 1, n: 2 } } # 3-P3/8
  - { type: flow, from: [ -1 ], module: ResNetLayer, repeat: 1, args: { in_channels: 256, out_channels: 512, stride: 2, is_first: False, e: 1, n: 2 } } # 4-P4/16
  - { type: head, from: [ -1 ], module: GDCHead, repeat: 1, args: { in_channels: 512, embedding_size: 512 } } # 5