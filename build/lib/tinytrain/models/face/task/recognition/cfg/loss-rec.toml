# =================
# 人脸识别loss配置文件
# =================

embedding_size = 512
# 模型最终输出的特征维度。

cls_loss_gain = 1
# 分类损失在总损失中的权重系数。
# 最终回传的分类 loss = 原始分类 loss × cls_loss_gain。
# 设为 1.0 表示保持原尺度；<1.0 可减弱分类梯度，>1.0 可加强。
# 例如 0.5 会把分类 loss 缩小一半，适用于分类 loss 占比过大、挤压回归/度量损失的场合。

sample_rate = 1.0
# 用于 PartialFC 采样(多卡训练有效)：每迭代只激活 sample_rate * num_classes 个负类中心。
# 1.0 表示不采样（使用全部类别）；0.1 表示只随机保留 10 % 负类中心参与计算。
# 当类别数非常大（百万级）时，适当降低可减少 GPU 内存与通信开销。

# ----------- margin 相关 -----------
s = 64
# 最终 logits 的缩放因子（temperature）。
# 与 ArcFace / CosFace 论文保持一致，常用 30~64；越大 logits 绝对值越大，softmax 分布越尖锐。

m_arc = 0.4
# ArcFace 角度 margin（弧度）。>0 时启用 ArcFace，与 m_cos 互斥。
# 推荐范围 0.2~0.5；0.4 是论文默认值。

m_cos = 0.0
# CosFace 余弦 margin。>0 时启用 CosFace，与 m_arc 互斥。
# 推荐范围 0.2~0.4；设为 0.0 表示关闭 CosFace。

interclass_filtering_threshold = 0.0
# 类间过滤阈值。若 >0，则对负类 logits 做抑制：
# cosine > threshold 的负类会被置 0，防止极端高相似度负类干扰训练。
# 0.0 表示关闭该功能；可尝试 0.2~0.3 以提升困难样本区分度。
