[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinytrain"
version = "0.1.0"
description = "A tiny training framework with PyTorch"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "zycskylove520", email = "867245713@qq.com"}
]
dependencies = [
    "albucore==0.0.23",
    "albumentations==2.0.1",
    "chardet==5.2.0",
    "lap==0.5.12",
    "loguru==0.7.3",
    "matplotlib==3.10.3",
    "numpy==2.3.1",
    "onnx==1.17.0",
    "onnxruntime==1.20.1",
    "onnxslim==0.1.47",
    "opencv-contrib-python==4.10.0.84",
    "opencv-python==4.10.0.84",
    "opencv-python-headless==4.10.0.84",
    "pandas==2.3.1",
    "Pillow==11.3.0",
    "pycocotools==2.0.8",
    "pydantic==2.11.7",
    "scipy==1.16.0",
    "seaborn==0.13.2",
    "setproctitle==1.3.6",
    "tabulate==0.9.0",
    "toml==0.10.2",
    "torch==2.5.1+cu124",
    "torchmetrics[detection]==1.7.1",
    "torchvision==0.20.1+cu124"
]

[project.urls]
Homepage = "https://github.com/yourname/TinyTrain"
Repository = "https://github.com/yourname/TinyTrain"

[tool.setuptools.packages.find]
where = ["."]              # 从当前目录查找
include = ["TinyTrain*"]   # 只打包 TinyTrain 目录