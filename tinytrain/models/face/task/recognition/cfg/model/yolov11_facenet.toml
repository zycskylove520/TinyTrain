# YOLOv11-rec image classification model_config.
name="YOLOv11_FaceNet"

scale = "n"

# model_config compound scaling constants
[scales.n]
depth = 0.50
summary = "152 layers, 19892096 parameters, 19892096 gradients, 1.52 GFLOPs, for a 112×112 input."

[scales.s]
depth = 1
summary = "216 layers, 95771520 parameters, 95771520 gradients, 7.46 GFLOPs, for a 112×112 input."

[scales.m]
depth = 1.50
summary = "688 layers, 379552704 parameters, 379552704 gradients, 31.09 GFLOPs, for a 112×112 input."

# ----------------------------backbone---------------------------------
[[network]]
# 0-P1/2
type = "entry"
module = "Conv"
repeat = 1
from = [-1]
args.in_channels = 3
args.out_channels = 32
args.kernel_size = 3
args.stride = 2

[[network]]
# 1-P2/4
type = "flow"
module = "Conv"
repeat = 1
from = [-1]
args.in_channels = 32
args.out_channels = 64
args.kernel_size = 3
args.stride = 2

[[network]]
# 2
type = "flow"
module = "C3k2"
repeat = 1
from = [-1]
args.in_channels = 64
args.out_channels = 128
args.n = 2
args.c3k = false
args.hidden_channels = 0.25

[[network]]
# 3-P3/8
type = "flow"
module = "Conv"
repeat = 1
from = [-1]
args.in_channels = 128
args.out_channels = 128
args.kernel_size = 3
args.stride = 2

[[network]]
# 4
type = "flow"
module = "C3k2"
repeat = 1
from = [-1]
args.in_channels = 128
args.out_channels = 256
args.n = 2
args.c3k = false
args.hidden_channels = 0.25

[[network]]
type = "flow"
# 5-P4/16
module = "Conv"
repeat = 1
from = [-1]
args.in_channels = 256
args.out_channels = 256
args.kernel_size = 3
args.stride = 2

[[network]]
# 6
type = "flow"
module = "C3k2"
repeat = 1
from = [-1]
args.in_channels = 256
args.out_channels = 256
args.n = 2
args.c3k = true
args.hidden_channels = 0.5

[[network]]
type = "flow"
# 7-P5/32
module = "Conv"
repeat = 1
from = [-1]
args.in_channels = 256
args.out_channels = 512
args.kernel_size = 3
args.stride = 2

[[network]]
# 8
type = "flow"
module = "C3k2"
repeat = 1
from = [-1]
args.in_channels = 512
args.out_channels = 512
args.n = 2
args.c3k = true
args.hidden_channels = 0.5

[[network]]
type = "flow"
# 9
module = "C2PSA"
repeat = 1
from = [-1]
args.in_channels = 512
args.out_channels = 512

# ----------------------------------head--------------------------------------
[[network]]
# 10
type = "head"
module = "GeneralFace"
repeat = 1
from = [-1]
args.in_channels = 512
args.embedding_size = 512