# MobileFaceNet face recognition model_config.
name = "MobileFaceNet"

scale = "n"

# model_config compound scaling constants
[scales.n]
depth = 0.5
summary = "140 layers, 7225216 parameters, 7225216 gradients, 2.83 GFLOPs, for a 112×112 input."

[scales.s]
depth = 1
summary = "213 layers, 12207616 parameters, 12207616 gradients, 5.28 GFLOPs, for a 112×112 input."

[scales.m]
depth = 2
summary = "370 layers, 22898304 parameters, 22898304 gradients, 10.84 GFLOPs, for a 112×112 input."

[scales.l]
depth = 3
summary = "526 layers, 35991808 parameters, 35991808 gradients, 17.7 GFLOPs, for a 112×112 input."

[scales.x]
depth = 4
summary = "682 layers, 51488128 parameters, 51488128 gradients, 25.85 GFLOPs, for a 112×112 input."

# ----------------------------backbone---------------------------------
[[network]]
# 0-P1/2
type = "entry"
module = "Conv"
repeat = 1
from = [-1]
args.in_channels = 3
args.out_channels = 64
args.kernel_size = 3
args.stride = 2
args.padding = 1

[[network]]
# 1
type = "flow"
module = "DWBlock"
allow_repeat = true
repeat = 1
from = [-1]
args.in_channels = 64
args.out_channels = 64
args.kernel_size = 3
args.stride = 1
args.padding = 1
args.groups = 64

[[network]]
# 2
type = "flow"
module = "DWBlock"
repeat = 1
from = [-1]
args.in_channels = 64
args.out_channels = 64
args.kernel_size = 3
args.stride = 2
args.padding = 1
args.groups = 128

[[network]]
# 3
type = "flow"
module = "DWBlock"
repeat = 4
from = [-1]
args.in_channels = 64
args.out_channels = 64
args.kernel_size = 3
args.stride = 1
args.padding = 1
args.groups = 128
args.residual = true

[[network]]
# 4
type = "flow"
module = "DWBlock"
repeat = 1
from = [-1]
args.in_channels = 64
args.out_channels = 128
args.kernel_size = 3
args.stride = 2
args.padding = 1
args.groups = 256

[[network]]
# 5
type = "flow"
module = "DWBlock"
repeat = 6
from = [-1]
args.in_channels = 128
args.out_channels = 128
args.kernel_size = 3
args.stride = 1
args.padding = 1
args.groups = 256
args.residual = true

[[network]]
# 6
type = "flow"
module = "DWBlock"
repeat = 1
from = [-1]
args.in_channels = 128
args.out_channels = 128
args.kernel_size = 3
args.stride = 2
args.padding = 1
args.groups = 512

[[network]]
# 7
type = "flow"
module = "DWBlock"
repeat = 2
from = [-1]
args.in_channels = 128
args.out_channels = 128
args.kernel_size = 3
args.stride = 1
args.padding = 1
args.groups = 256
args.residual = true


# ----------------------------------head--------------------------------------
[[network]]
# 10
type = "head"
module = "GDC"
repeat = 1
from = [-1]
args.in_channels = 128
args.embedding_size = 512
