# YOLOv8-cls image classification model_config.

scale = "n"

# model_config compound scaling constants
[scales.n]
depth = 0.33
width = 0.25
summary = "YOLOv8n-cls model"

[scales.s]
depth = 0.33
width = 0.50
summary = "YOLOv8s-cls model"

[scales.m]
depth = 0.67
width = 0.75
summary = "YOLOv8m-cls model"

[scales.l]
depth = 1.00
width = 1.00
summary = "YOLOv8l-cls model"

[scales.x]
depth = 1.00
width = 1.25
summary = "YOLOv8x-cls model"

# ----------------------------backbone---------------------------------
[[network]]
# 0-P1/2
type = "entry"
module = "Conv"
repeat = 1
from = [-1]
args.in_channels = 3
args.out_channels = 64
args.kernel_size = 3
args.stride = 2

[[network]]
# 1-P2/4
type = "flow"
module = "Conv"
repeat = 1
from = [-1]
args.in_channels = 64
args.out_channels = 128
args.kernel_size = 3
args.stride = 2

[[network]]
# 2
type = "flow"
module = "C2f"
repeat = 3
from = [-1]
args.in_channels = 128
args.out_channels = 128
args.shortcut = true

[[network]]
# 3-P3/8
type = "flow"
module = "Conv"
repeat = 1
from = [-1]
args.in_channels = 128
args.out_channels = 256
args.kernel_size = 3
args.stride = 2

[[network]]
# 4
type = "flow"
module = "C2f"
repeat = 6
from = [-1]
args.in_channels = 256
args.out_channels = 256
args.shortcut = true

[[network]]
# 5-P4/16
type = "flow"
module = "Conv"
repeat = 1
from = [-1]
args.in_channels = 256
args.out_channels = 512
args.kernel_size = 3
args.stride = 2

[[network]]
# 6
type = "flow"
module = "C2f"
repeat = 6
from = [-1]
args.in_channels = 512
args.out_channels = 512
args.shortcut = true

[[network]]
# 7-P5/32
type = "flow"
module = "Conv"
repeat = 1
from = [-1]
args.in_channels = 512
args.out_channels = 1024
args.kernel_size = 3
args.stride = 2

[[network]]
# 8
type = "flow"
module = "C2f"
repeat = 3
from = [-1]
args.in_channels = 1024
args.out_channels = 1024
args.shortcut = true

# ----------------------------------head--------------------------------------
[[network]]
# 9
type = "head"
module = "Classify"
repeat = 1
from = [-1]
args.in_channels = 1024
args.nc = -1