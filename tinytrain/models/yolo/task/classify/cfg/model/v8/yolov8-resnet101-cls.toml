# YOLOv8-resnet101-cls image classification model_config.

scale = "n"

# model_config compound scaling constants
[scales.n]
depth = 0.33
width = 0.25
summary = "YOLOv8n-resnet101-cls model"

[scales.s]
depth = 0.33
width = 0.50
summary = "YOLOv8s-resnet101-cls model"

[scales.m]
depth = 0.67
width = 0.75
summary = "YOLOv8m-resnet101-cls model"

[scales.l]
depth = 1.00
width = 1.00
summary = "YOLOv8l-resnet101-cls model"

[scales.x]
depth = 1.00
width = 1.25
summary = "YOLOv8x-resnet50-cls model"

# ----------------------------backbone---------------------------------
[[network]]
# 0-P1/2
type = "entry"
module = "ResNetLayer"
repeat = 1
from = [-1]
args.in_channels = 3
args.out_channels = 64
args.stride = 1
args.is_first = true
args.n = 1

[[network]]
# 1-P1/4
type = "flow"
module = "ResNetLayer"
repeat = 1
from = [-1]
args.in_channels = 64
args.out_channels = 64
args.stride = 1
args.is_first = false
args.n = 3

[[network]]
# 2-P2/8
type = "flow"
module = "ResNetLayer"
repeat = 1
from = [-1]
args.in_channels = 256
args.out_channels = 128
args.stride = 2
args.is_first = false
args.n = 4

[[network]]
# 3-P3/16
type = "flow"
module = "ResNetLayer"
repeat = 1
from = [-1]
args.in_channels = 512
args.out_channels = 256
args.stride = 2
args.is_first = false
args.n = 23

[[network]]
# 4-P4/32
type = "flow"
module = "ResNetLayer"
repeat = 1
from = [-1]
args.in_channels = 1024
args.out_channels = 512
args.stride = 2
args.is_first = false
args.n = 3

# ----------------------------------head--------------------------------------
[[network]]
# 9
type = "head"
module = "Classify"
repeat = 1
from = [-1]
args.in_channels = 2048
args.nc = -1