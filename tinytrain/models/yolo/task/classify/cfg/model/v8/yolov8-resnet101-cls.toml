# YOLOv8-resnet101-cls image classification model_config.
name = "YOLOv8-resnet101-cls"

scale = "n"

# model_config compound scaling constants
[scales.n]
depth = 0.33
width = 0.25
summary = "436 layers, 3348506 parameters, 3348506 gradients, 1.11 GFLOPs, for a 224×224 input."

[scales.s]
depth = 0.33
width = 0.50
summary = "436 layers, 11979818 parameters, 11979818 gradients, 4.14 GFLOPs, for a 224×224 input."

[scales.m]
depth = 0.67
width = 0.75
summary = "436 layers, 25909306 parameters, 25909306 gradients, 9.09 GFLOPs, for a 224×224 input."

[scales.l]
depth = 1.00
width = 1.00
summary = "436 layers, 45136970 parameters, 45136970 gradients, 15.95 GFLOPs, for a 224×224 input."

[scales.x]
depth = 1.00
width = 1.25
summary = "436 layers, 69662810 parameters, 69662810 gradients, 24.74 GFLOPs, for a 224×224 input."

# ----------------------------backbone---------------------------------
[[network]]
# 0-P1/2
type = "entry"
module = "ResNetLayer"
repeat = 1
from = [-1]
args.in_channels = 3
args.out_channels = 64
args.stride = 1
args.is_first = true
args.n = 1

[[network]]
# 1-P1/4
type = "flow"
module = "ResNetLayer"
repeat = 1
from = [-1]
args.in_channels = 64
args.out_channels = 64
args.stride = 1
args.is_first = false
args.n = 3

[[network]]
# 2-P2/8
type = "flow"
module = "ResNetLayer"
repeat = 1
from = [-1]
args.in_channels = 256
args.out_channels = 128
args.stride = 2
args.is_first = false
args.n = 4

[[network]]
# 3-P3/16
type = "flow"
module = "ResNetLayer"
repeat = 1
from = [-1]
args.in_channels = 512
args.out_channels = 256
args.stride = 2
args.is_first = false
args.n = 23

[[network]]
# 4-P4/32
type = "flow"
module = "ResNetLayer"
repeat = 1
from = [-1]
args.in_channels = 1024
args.out_channels = 512
args.stride = 2
args.is_first = false
args.n = 3

# ----------------------------------head--------------------------------------
[[network]]
# 9
type = "head"
module = "Classify"
repeat = 1
from = [-1]
args.in_channels = 2048
args.nc = -1