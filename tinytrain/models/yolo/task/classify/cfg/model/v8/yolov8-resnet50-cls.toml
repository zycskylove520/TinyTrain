# =============================================
# YOLO图像分类模型: YOLOv8-resnet50-cls 模型配置文件
# =============================================

name = "YOLOv8-resnet50-cls"
scale = "n"

# model_config compound scaling constants
[scales.n]
depth = 0.33
width = 0.25
summary = "232 layers, 2151706 parameters, 2151706 gradients, 0.64 GFLOPs, for a 224×224 input."

[scales.s]
depth = 0.33
width = 0.50
summary = "232 layers, 7218730 parameters, 7218730 gradients, 2.27 GFLOPs, for a 224×224 input."

[scales.m]
depth = 0.67
width = 0.75
summary = "232 layers, 15216442 parameters, 15216442 gradients, 4.89 GFLOPs, for a 224×224 input."

[scales.l]
depth = 1.00
width = 1.00
summary = "232 layers, 26144842 parameters, 26144842 gradients, 8.5 GFLOPs, for a 224×224 input."

[scales.x]
depth = 1.00
width = 1.25
summary = "232 layers, 40003930 parameters, 40003930 gradients, 13.1 GFLOPs, for a 224×224 input."

# ----------------------------backbone---------------------------------
[[network]]
# 0-P1/2
type = "entry"
module = "ResNetLayer"
repeat = 1
from = [-1]
args.in_channels = 3
args.out_channels = 64
args.stride = 1
args.is_first = true
args.n = 1

[[network]]
# 1-P1/4
type = "flow"
module = "ResNetLayer"
repeat = 1
from = [-1]
args.in_channels = 64
args.out_channels = 64
args.stride = 1
args.is_first = false
args.n = 3

[[network]]
# 2-P2/8
type = "flow"
module = "ResNetLayer"
repeat = 1
from = [-1]
args.in_channels = 256
args.out_channels = 128
args.stride = 2
args.is_first = false
args.n = 4

[[network]]
# 3-P3/16
type = "flow"
module = "ResNetLayer"
repeat = 1
from = [-1]
args.in_channels = 512
args.out_channels = 256
args.stride = 2
args.is_first = false
args.n = 6

[[network]]
# 4-P4/32
type = "flow"
module = "ResNetLayer"
repeat = 1
from = [-1]
args.in_channels = 1024
args.out_channels = 512
args.stride = 2
args.is_first = false
args.n = 3

# ----------------------------------head--------------------------------------
[[network]]
# 9
type = "head"
module = "ClassifyHead"
repeat = 1
from = [-1]
args.in_channels = 2048
args.nc = -1