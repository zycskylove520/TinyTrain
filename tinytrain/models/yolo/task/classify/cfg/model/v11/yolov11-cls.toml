# =====================================
# YOLO图像分类模型: YOLOv11-cls 模型配置文件
# =====================================

name = "YOLOv11-cls"
scale = "n"

# model_config compound scaling constants
[scales.n]
depth = 0.50
width = 0.25
summary = "151 layers, 1543914 parameters, 1543914 gradients, 0.4 GFLOPs, for a 224×224 input."

[scales.s]
depth = 0.50
width = 0.50
summary = "151 layers, 5455818 parameters, 5455818 gradients, 1.48 GFLOPs, for a 224×224 input."

[scales.m]
depth = 0.50
width = 1.00
summary = "187 layers, 20471626 parameters, 20471626 gradients, 5.83 GFLOPs, for a 224×224 input."

[scales.l]
depth = 1.00
width = 1.00
summary = "287 layers, 25046346 parameters, 25046346 gradients, 7.28 GFLOPs, for a 224×224 input."

[scales.x]
depth = 1.00
width = 1.50
summary = "287 layers, 55317994 parameters, 55317994 gradients, 16.22 GFLOPs, for a 224×224 input."

# ----------------------------backbone---------------------------------
[[network]]
# 0-P1/2
type = "entry"
module = "CBA"
repeat = 1
from = [-1]
args.in_channels = 3
args.out_channels = 64
args.kernel_size = 3
args.stride = 2

[[network]]
# 1-P2/4
type = "flow"
module = "CBA"
repeat = 1
from = [-1]
args.in_channels = 64
args.out_channels = 128
args.kernel_size = 3
args.stride = 2

[[network]]
# 2
type = "flow"
module = "C3k2"
repeat = 1
from = [-1]
args.in_channels = 128
args.out_channels = 256
args.n = 2
args.c3k = false
args.hidden_channels = 0.25

[[network]]
# 3-P3/8
type = "flow"
module = "CBA"
repeat = 1
from = [-1]
args.in_channels = 256
args.out_channels = 256
args.kernel_size = 3
args.stride = 2

[[network]]
# 4
type = "flow"
module = "C3k2"
repeat = 1
from = [-1]
args.in_channels = 256
args.out_channels = 512
args.n = 2
args.c3k = false
args.hidden_channels = 0.25

[[network]]
type = "flow"
# 5-P4/16
module = "CBA"
repeat = 1
from = [-1]
args.in_channels = 512
args.out_channels = 512
args.kernel_size = 3
args.stride = 2

[[network]]
# 6
type = "flow"
module = "C3k2"
repeat = 1
from = [-1]
args.in_channels = 512
args.out_channels = 512
args.n = 2
args.c3k = true

[[network]]
type = "flow"
# 7-P5/32
module = "CBA"
repeat = 1
from = [-1]
args.in_channels = 512
args.out_channels = 1024
args.kernel_size = 3
args.stride = 2

[[network]]
# 8
type = "flow"
module = "C3k2"
repeat = 1
from = [-1]
args.in_channels = 1024
args.out_channels = 1024
args.n = 2
args.c3k = true

[[network]]
type = "flow"
# 9
module = "C2PSA"
repeat = 1
from = [-1]
args.in_channels = 1024
args.out_channels = 1024

# ----------------------------------head--------------------------------------
[[network]]
# 10
type = "head"
module = "ClassifyHead"
repeat = 1
from = [-1]
args.in_channels = 1024
args.nc = -1