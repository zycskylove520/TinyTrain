# YOLOv12-cls image classification model_config.
name = "YOLOv12-cls"

scale = "n"

# model_config compound scaling constants
[scales.n]
depth = 0.50
width = 0.25
summary = "251 layers, 1731306 parameters, 1731306 gradients, 0.44 GFLOPs, for a 224×224 input."

[scales.s]
depth = 0.50
width = 0.50
summary = "251 layers, 6117322 parameters, 6117322 gradients, 1.65 GFLOPs, for a 224×224 input."

[scales.m]
depth = 0.50
width = 1.00
summary = "287 layers, 22941514 parameters, 22941514 gradients, 6.46 GFLOPs, for a 224×224 input."

[scales.l]
depth = 1.00
width = 1.00
summary = "517 layers, 31039706 parameters, 31039706 gradients, 8.47 GFLOPs, for a 224×224 input."

[scales.x]
depth = 1.00
width = 1.50
summary = "517 layers, 68528954 parameters, 68528954 gradients, 18.83 GFLOPs, for a 224×224 input."

# ----------------------------backbone---------------------------------
[[network]]
# 0-P1/2
type = "entry"
module = "Conv"
repeat = 1
from = [-1]
args.in_channels = 3
args.out_channels = 64
args.kernel_size = 3
args.stride = 2

[[network]]
# 1-P2/4
type = "flow"
module = "Conv"
repeat = 1
from = [-1]
args.in_channels = 64
args.out_channels = 128
args.kernel_size = 3
args.stride = 2

[[network]]
# 2
type = "flow"
module = "C3k2"
repeat = 1
from = [-1]
args.in_channels = 128
args.out_channels = 256
args.n = 2
args.c3k = false
args.hidden_channels = 0.25

[[network]]
# 3-P3/8
type = "flow"
module = "Conv"
repeat = 1
from = [-1]
args.in_channels = 256
args.out_channels = 256
args.kernel_size = 3
args.stride = 2

[[network]]
# 4
type = "flow"
module = "C3k2"
repeat = 1
from = [-1]
args.in_channels = 256
args.out_channels = 512
args.n = 2
args.c3k = false
args.hidden_channels = 0.25

[[network]]
type = "flow"
# 5-P4/16
module = "Conv"
repeat = 1
from = [-1]
args.in_channels = 512
args.out_channels = 512
args.kernel_size = 3
args.stride = 2

[[network]]
type = "flow"
# 6
module = "A2C2f"
repeat = 1
from = [-1]
args.in_channels = 512
args.out_channels = 512
args.n = 4
args.a2 = true
args.area = 4

[[network]]
type = "flow"
# 7-P5/32
module = "Conv"
repeat = 1
from = [-1]
args.in_channels = 512
args.out_channels = 1024
args.kernel_size = 3
args.stride = 2

[[network]]
type = "flow"
# 8
module = "A2C2f"
repeat = 1
from = [-1]
args.in_channels = 1024
args.out_channels = 1024
args.n = 4
args.a2 = true
args.area = 1

# ----------------------------------head--------------------------------------
[[network]]
# 9
type = "head"
module = "Classify"
repeat = 1
from = [-1]
args.in_channels = 1024
args.nc = -1