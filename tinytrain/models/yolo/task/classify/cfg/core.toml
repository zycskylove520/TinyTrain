# ================================================================================
# TinyTrain框架核心配置文件，用于定义训练任务的基本参数、训练设置、超参数配置以及分布式训练等关键信息。
# ================================================================================

#------------------------------------------base-------------------------------------------
task = "classify"
# type: str
# 指定训练的任务类型，必须与Core类中注册的 task 名一致（大小写敏感）。

save_dir = "runs"
# type: str
# 任意合法路径；支持绝对路径、相对路径、带空格路径（自动加引号）,所有训练产出（权重、日志、可视化、...）的根目录。
# 框架会在其下再建二级目录：{save_dir}/{project_name}/{task}/train_{i}
# 推荐：
#   单机：/data/runs 或 ./runs
#   集群：/ssd/runs 或 /mnt/cache/runs，避免 NFS 小文件风暴

project_name = ""
# type: str
# 项目名称。如果为空字符串，则训练结果保存在默认目录 `{save_dir}/default_project/` 下。
# 注意：同一次实验的继续训练（resume）必须同名，否则找不到断点续训的权重文件。


#------------------------------------------Train settings----------------------------------
epochs = 10
# type: int
# 训练总轮数。必须 >=1。
# 分布式训练时，该值指整个训练的总 epoch 数，不会随 GPU 数倍增。

batch_size = 16
# type: int
# 每个批次的样本数量。必须 >=2。
# 分布式训练时，该值指每张卡的 batch_size，不会随 GPU 数量倍增。
# 如果模型中使用了 BatchNorm，小于 2 会触发 BatchNorm 统计量失效的异常。

device = 0
# type: list[int] | int | "mps" | "cpu" | "cuda"
# 训练使用设备。可以是 GPU 设备编号（整数或整数列表）、"mps"（苹果 Metal）、"cpu" 或 "cuda"。
# 如果设置为"cuda"，则默认使用0号GPU，当cuda不可用时，回退到使用CPU进行训练。
# 写法对照：
#   单卡 0        → 0
#   单卡 1        → 1
#   两卡 0,1      → [0,1]
#   CPU            → "cpu"
#   MPS(M1/M2)     → "mps"
# 集群多机：这里写单机内的卡号，NODE_RANK 环境变量决定节点

workers = 0
# type: int
# DataLoader的多线程数量，必须 >=0。
# 0表示主线程加载，调试时方便打断点；生产建议 4~8。
# 分布式训练时，该值指每张卡的 workers，不会平均给每个设备。

resume = false
# type: bool
# 断点续训，是否从上次中断的训练进度继续训练。

amp = true
# type: [bool]
# 自动混合精度（AMP），用于节省内存并加速训练，开启后显存≈减半，速度+20~50%，但可能影响精度。
# 关闭场景：
#   - 出现 NaN/loss 爆炸，先关 amp 排查
#   - CPU/MPS 训练框架自动强制 false

accumulate = 1
# type: int
# 梯度累积步数。每累积 `accumulate` 步后更新一次参数。必须 >=1。
# 想跑大 batch 但显存不够时，可用 accumulate 模拟。
# 全局 batch = batch_size * GPU * accumulate；LR  Scheduler 会按全局 batch 自动缩放。
# 注意：BN 层统计量仍按“物理 batch”更新，accumulate 过大（>16）可能导致 BN 抖动。

patience = 0
# type: int
# 早停机制的耐心值。必须 >=0，值为 0 表示不启用。
# 如果训练结果在 `patience` 个 epoch 内没有改善，则提前终止训练。

save_period = 0
# type: int
# 每隔多少个 epoch 保存一次模型权重文件。必须 >=0，值为 0 表示不保存中间权重。

time = 0
# type: int
# 训练时间限制（秒）。训练超过该时间后自动终止。必须 >=0，值为 0 表示不限制训练时间。

seed = 0
# type: int
# 随机种子，用于复现训练结果。值为 0 表示不设置（每次随机）。
# 分布式：主节点 seed 生效，其它 rank 自动 +1 保证采样不同。
# 复现论文：写固定值，同时设置下面的 deterministic=true

deterministic = false
# type: bool
# 是否启用确定性模式，确保在相同的输入、硬件和软件环境下，每次运行的结果完全一致。
# 启用后，cuDNN 确定性卷积，速度-5~15 %。

ema = false
# type: bool
# 指数移动平均（EMA）。EMA 模式下可以生成参数更平滑的模型，提升模型评估指标，但会增加训练时间，适用于中小型模型。
# 启用 EMA 模型，将在训练结束后保存 EMA 模型的权重文件。

launch_tb = false
# type: bool
# 是否启动 TensorBoard 可视化训练过程。
# TensorBoard 日志会写入到保存目录: {save_dir}/{project_name}/{task}/train_{i}/log，训练结束后会自动关闭。

grad_clip = 10
# type: int | float
# 梯度裁剪阈值，为全局梯度 L2 范数上限。必须 >=0，值为0表示不启用。
# 用于防止训练初期设置过大的学习率造成的梯度爆炸。

bf16 = false
# type: bool
# 是否使用 bfloat16 精度进行训练，需 Ampere+ 且 PyTorch≥1.12。
# 优势：动态范围比 float16 大，bfloat16 精度比 float16 精度更高，几乎不掉精度；劣势：只有部分硬件支持，谨慎使用。

only_val = false
# type: bool
# 不进行训练，仅执行验证。

fp16_pt = false
# type: bool
# 训练结束时的simplified模型权重将以float16精度保存，体积减半，部署时初始化更快。


#------------------------------------------Optimizer settings------------------------------------------
optimizer = "SGD"
# type: "Adam" | "AdamW" | "Adamax" | "NAdam" | "RAdam" | "RMSProp" | "SGD" | "Adadelta" | "Adagrad" | ...
# 内置支持第三方优化器：Lion/AdaBelief/AdaBound/Lamb/Ranger/Ranger21（需 pip 安装对应包）。

lr0 = 0.01
# type: float
# 训练开始时的初始学习率。必须 >0。
# 分布式训练时，初始学习率=lr0 * world_size * accumulate。
# 参考起点：
#   SGD       0.01
#   AdamW     0.001

lr1 = 0.01
# type: float
# 最终学习率=lr1 * lr0。必须 >0。
# 若想保持 constant，写 1.0。

momentum = 0.97
# type: float
# 优化器的动量值。必须 >0。

weight_decay = 0.0005
# type: float
# 优化器的权重衰减（L2 正则化）值。用于防止过拟合。必须 >0。
# 推荐:
#   CNN: 1e-4~5e-4
#   Transformer: 1e-2~1e-1

l1_norm = 0.0
# type: float
# L1 正则化值，用于防止过拟合。必须 >=0。
# >0 时会稀疏化权重，训练时间 +30 %。


#------------------------------------------Scheduler settings------------------------------------------
warmup_scheduler = "LinearWarmupLR"
# type: "LinearWarmupLR" | "CosineWarmUpLR" | "ExponentialWarmUpLR" | "ConstantWarmupLR"
# 训练预热阶段的学习率调度器类型。如果调度器不存在，则默认使用LinearWarmupLR。
# 预热阶段让 lr 从 warmup_lr → lr0，防止前期大 lr 破坏预训练权重

warmup_lr = 0.0001
# type: float
# 预热阶段的起始学习率。必须 >0。

warmup_epochs = 3
# type: int
# 预热阶段的 epoch 数量。必须 >=0。
# 如果 warmup_epochs 大于0，则非warmup阶段训练epochs = 总epochs - warmup_epochs。

scheduler = "LinearLR"
# type: "LinearLR" | "CosineLR" | "ExponentialLR" | "StepLR" | "MultiStepLR" | "auto"
# 非warmup阶段，正式训练时的学习率调度器。
# auto 模式下，模型会根据训练效果自动调整学习率。如果衰减器不存在，则默认使用LinearLR。

t_max = 10
# type: int
# CosineLR学习率调度器最大周期数。必须 >=1。

plateau_epochs = 5
# type: int
# auto 学习率调度器的 patience，连续 N epoch 无改善则降低学习率。必须 >=1。

plateau_factor = 0.5
# type: float
# auto 学习率调度器下降学习率的倍数。必须 >0。

plateau_sensitivity = 0.01
# type: float
# auto 学习率调度器的“无改善”阈值，绝对值小于该数视为没涨点。必须 >0。


#------------------------------------------DDP settings----------------------------------
use_torchrun = true
# type: bool
# Pytorch 2.X 开始支持torchrun启动DDP训练，如果是 Pytorch 1.X 则建议设置为false。

master_addr = "127.0.0.1"
# type: str
# 分布式训练时的主机 IP 地址。

master_port = 29500
# type: int
# 分布式训练时的主机端口。可取值范围: 1024~65535。
# 单机多卡情况下，如果端口被占用，则会自动寻找可用端口。
# 多机多卡情况下，如果端口被占用，将抛出异常。

nnodes = 1
# type: int
# 分布式训练的节点数量。

node_rank = 0
# type: int
# 当前节点的排名（RANK）。