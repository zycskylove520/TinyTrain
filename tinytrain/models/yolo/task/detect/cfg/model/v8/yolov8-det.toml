# ====================================
# YOLO目标检测模型: YOLOv8-det 模型配置文件
# ====================================

name = "YOLOv8-det"
scale = "n"

# model_config compound scaling constants
[scales.n]
depth = 0.33
width = 0.25
summary = "326 layers, 3453346 parameters, 3453346 gradients, 8.62 GFLOPs, for a 640×640 input."

[scales.s]
depth = 0.33
width = 0.50
summary = "326 layers, 12880754 parameters, 12880754 gradients, 30.29 GFLOPs, for a 640×640 input."

[scales.m]
depth = 0.67
width = 0.75
summary = "418 layers, 35191938 parameters, 35191938 gradients, 85.64 GFLOPs, for a 640×640 input."

[scales.l]
depth = 1.00
width = 1.00
summary = "572 layers, 85628690 parameters, 85628690 gradients, 209.19 GFLOPs, for a 640×640 input."

[scales.x]
depth = 1.00
width = 1.25
summary = "572 layers, 133748130 parameters, 133748130 gradients, 326.43 GFLOPs, for a 640×640 input."

# ----------------------------backbone---------------------------------
[[network]]
# 0-P1/2
type = "entry"
module = "CBA"
repeat = 1
from = [-1]
args.in_channels = 3
args.out_channels = 64
args.kernel_size = 3
args.stride = 2

[[network]]
# 1-P2/4
type = "flow"
module = "CBA"
repeat = 1
from = [-1]
args.in_channels = 64
args.out_channels = 128
args.kernel_size = 3
args.stride = 2

[[network]]
# 2
type = "flow"
module = "C2f"
repeat = 3
from = [-1]
args.in_channels = 128
args.out_channels = 128
args.shortcut = true

[[network]]
# 3-P3/8
type = "flow"
module = "CBA"
repeat = 1
from = [-1]
args.in_channels = 128
args.out_channels = 256
args.kernel_size = 3
args.stride = 2

[[network]]
# 4
type = "flow"
module = "C2f"
repeat = 6
from = [-1]
args.in_channels = 256
args.out_channels = 256
args.shortcut = true

[[network]]
# 5-P4/16
type = "flow"
module = "CBA"
repeat = 1
from = [-1]
args.in_channels = 256
args.out_channels = 512
args.kernel_size = 3
args.stride = 2

[[network]]
# 6
type = "flow"
module = "C2f"
repeat = 6
from = [-1]
args.in_channels = 512
args.out_channels = 512
args.shortcut = true

[[network]]
# 7-P5/32
type = "flow"
module = "CBA"
repeat = 1
from = [-1]
args.in_channels = 512
args.out_channels = 1024
args.kernel_size = 3
args.stride = 2

[[network]]
# 8
type = "flow"
module = "C2f"
repeat = 3
from = [-1]
args.in_channels = 1024
args.out_channels = 1024
args.shortcut = true

[[network]]
# 9
type = "flow"
module = "SPPF"
repeat = 1
from = [-1]
args.in_channels = 1024
args.out_channels = 1024
args.kernel_size = 5

# ----------------------------------head--------------------------------------
[[network]]
# 10
type = "flow"
module = "torch.nn.Upsample"
repeat = 1
from = [-1]
args.scale_factor = 2
args.mode = "nearest"

[[network]]
# 11 cat backbone P4
type = "flow"
module = "Concat"
repeat = 1
from = [-1, 6]

[[network]]
# 12
type = "flow"
module = "C2f"
repeat = 1
from = [-1]
args.in_channels = 1536
args.out_channels = 512

[[network]]
# 13
type = "flow"
module = "C2f"
repeat = 2
from = [-1]
args.in_channels = 512
args.out_channels = 512

[[network]]
# 14
type = "flow"
module = "torch.nn.Upsample"
repeat = 1
from = [-1]
args.scale_factor = 2
args.mode = "nearest"

[[network]]
# 15 cat backbone P3
type = "flow"
module = "Concat"
repeat = 1
from = [-1, 4]

[[network]]
# 16
type = "flow"
module = "C2f"
repeat = 1
from = [-1]
args.in_channels = 768
args.out_channels = 256

[[network]]
# 17 (P3/8-small)
type = "flow"
module = "C2f"
repeat = 2
from = [-1]
args.in_channels = 256
args.out_channels = 256

[[network]]
# 18
type = "flow"
module = "CBA"
repeat = 1
from = [-1]
args.in_channels = 256
args.out_channels = 256
args.kernel_size = 3
args.stride = 2

[[network]]
# 19 cat head P4
type = "flow"
module = "Concat"
repeat = 1
from = [-1, 13]

[[network]]
# 20
type = "flow"
module = "C2f"
repeat = 1
from = [-1]
args.in_channels = 768
args.out_channels = 512

[[network]]
# 21 (P4/16-medium)
type = "flow"
module = "C2f"
repeat = 2
from = [-1]
args.in_channels = 512
args.out_channels = 512

[[network]]
# 22
type = "flow"
module = "CBA"
repeat = 1
from = [-1]
args.in_channels = 512
args.out_channels = 512
args.kernel_size = 3
args.stride = 2

[[network]]
# 23 cat head P5
type = "flow"
module = "Concat"
repeat = 1
from = [-1, 9]

[[network]]
# 24
type = "flow"
module = "C2f"
repeat = 1
from = [-1]
args.in_channels = 1536
args.out_channels = 1024

[[network]]
# 25 (P5/32-large)
type = "flow"
module = "C2f"
repeat = 2
from = [-1]
args.in_channels = 1024
args.out_channels = 1024

[[network]]
# 26
type = "flow"
module = "Combine"
repeat = 1
from = [17, 21, 25]

[[network]]
# 27 Detect(P3, P4, P5)
type = "head"
module = "YOLODetectHead"
repeat = 1
from = [-1]
args.nc = -1
args.from_channels = [256, 512, 1024]