name = "YOLOv8-ghost-p6-det"
scale = "n"

# model_config compound scaling constants
[scales.n]
depth = 0.33
width = 0.25
summary = "578 layers, 4206828 parameters, 4206828 gradients, 6.58 GFLOPs, for a 640×640 input."

[scales.s]
depth = 0.33
width = 0.50
summary = "578 layers, 15487936 parameters, 15487936 gradients, 21.94 GFLOPs, for a 640×640 input."

[scales.m]
