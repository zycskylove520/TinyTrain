width = 1.00
summary = "1111 layers, 88029704 parameters, 88029704 gradients, 126.32 GFLOPs, for a 640×640 input."

[scales.x]
depth = 1.00
width = 1.25
summary = "1111 layers, 137434820 parameters, 137434820 gradients, 196.76 GFLOPs, for a 640×640 input."

