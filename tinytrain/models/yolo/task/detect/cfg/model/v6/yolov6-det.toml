# YOLOv6-det model_config.
name = "YOLOv6-det"

scale = "n"

# model_config compound scaling constants
[scales.n]
depth = 0.33
width = 0.25
summary = "218 layers, 4160322 parameters, 4160322 gradients, 11.54 GFLOPs, for a 640×640 input."

[scales.s]
depth = 0.33
width = 0.50
summary = "218 layers, 15986354 parameters, 15986354 gradients, 42.92 GFLOPs, for a 640×640 input."

[scales.m]
depth = 0.67
width = 0.75
summary = "296 layers, 61909986 parameters, 61909986 gradients, 167.13 GFLOPs, for a 640×640 input."

[scales.l]
depth = 1.00
width = 1.00
summary = "374 layers, 156533650 parameters, 156533650 gradients, 424.24 GFLOPs, for a 640×640 input."

[scales.x]
depth = 1.00
width = 1.25
summary = "374 layers, 244324738 parameters, 244324738 gradients, 661.66 GFLOPs, for a 640×640 input."

