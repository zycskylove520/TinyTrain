# YOLOv5-det model_config.

scale = "l"

# model_config compound scaling constants
[scales.n]
depth = 0.33
width = 0.25
summary = "yolov5n-det model"

[scales.s]
depth = 0.33
width = 0.50
summary = "yolov5s-det model"

[scales.m]
depth = 0.67
width = 0.75
summary = "yolov5m-det models"

[scales.l]
depth = 1.00
width = 1.00
summary = "yolov5l-det model"

[scales.x]
depth = 1.33
width = 1.25
summary = "yolov5x-det model"

# ----------------------------YOLOv5 v6.0 backbone---------------------------------
[[network]]
# 0-P1/2
type = "entry"
module = "Conv"
repeat = 1
from = [-1]
args.in_channels = 3
args.out_channels = 64
args.kernel_size = 6
args.stride = 2
args.padding = 2

[[network]]
# 1-P2/4
type = "flow"
module = "Conv"
repeat = 1
from = [-1]
args.in_channels = 64
args.out_channels = 128
args.kernel_size = 3
args.stride = 2

[[network]]
# 2
type = "flow"
module = "C3"
repeat = 3
from = [-1]
args.in_channels = 128
args.out_channels = 128

[[network]]
# 3-P3/8
type = "flow"
module = "Conv"
repeat = 1
from = [-1]
args.in_channels = 128
args.out_channels = 256
args.kernel_size = 3
args.stride = 2

[[network]]
# 4
type = "flow"
module = "C3"
repeat = 6
from = [-1]
args.in_channels = 256
args.out_channels = 256

[[network]]
# 5-P4/16
type = "flow"
module = "Conv"
repeat = 1
from = [-1]
args.in_channels = 256
args.out_channels = 512
args.kernel_size = 3
args.stride = 2

[[network]]
# 6
type = "flow"
module = "C3"
repeat = 9
from = [-1]
args.in_channels = 512
args.out_channels = 512

[[network]]
# 7-P5/32
type = "flow"
module = "Conv"
repeat = 1
from = [-1]
args.in_channels = 512
args.out_channels = 1024
args.kernel_size = 3
args.stride = 2

[[network]]
# 8
type = "flow"
module = "C3"
repeat = 3
from = [-1]
args.in_channels = 1024
args.out_channels = 1024

[[network]]
# 9
type = "flow"
module = "SPPF"
repeat = 1
from = [-1]
args.in_channels = 1024
args.out_channels = 1024
args.kernel_size = 5

# ----------------------------------head--------------------------------------
[[network]]
# 10
type = "flow"
module = "Conv"
repeat = 1
from = [-1]
args.in_channels = 1024
args.out_channels = 512
args.kernel_size = 1
args.stride = 1

[[network]]
# 11
type = "flow"
module = "torch.nn.Upsample"
repeat = 1
from = [-1]
args.scale_factor = 2
args.mode = "nearest"

[[network]]
# 12 cat backbone P4
type = "flow"
module = "Concat"
repeat = 1
from = [-1, 6]

[[network]]
# 13
type = "flow"
module = "C3"
repeat = 1
from = [-1]
args.in_channels = 1024
args.out_channels = 512
args.shortcut = false

[[network]]
# 14
type = "flow"
module = "C3"
repeat = 2
from = [-1]
args.in_channels = 512
args.out_channels = 512
args.shortcut = false

[[network]]
# 15
type = "flow"
module = "Conv"
repeat = 1
from = [-1]
args.in_channels = 512
args.out_channels = 256
args.kernel_size = 1
args.stride = 1

[[network]]
# 16
type = "flow"
module = "torch.nn.Upsample"
repeat = 1
from = [-1]
args.scale_factor = 2
args.mode = "nearest"

[[network]]
# 17 cat backbone P3
type = "flow"
module = "Concat"
repeat = 1
from = [-1, 4]

[[network]]
# 18
type = "flow"
module = "C3"
repeat = 1
from = [-1]
args.in_channels = 512
args.out_channels = 256
args.shortcut = false

[[network]]
# 19 (P3/8-small)
type = "flow"
module = "C3"
repeat = 2
from = [-1]
args.in_channels = 256
args.out_channels = 256
args.shortcut = false

[[network]]
# 20
type = "flow"
module = "Conv"
repeat = 1
from = [-1]
args.in_channels = 256
args.out_channels = 256
args.kernel_size = 3
args.stride = 2

[[network]]
# 21 cat head P4
type = "flow"
module = "Concat"
repeat = 1
from = [-1, 15]

[[network]]
# 22 (P4/16-medium)
type = "flow"
module = "C3"
repeat = 3
from = [-1]
args.in_channels = 512
args.out_channels = 512
args.shortcut = false

[[network]]
# 23
type = "flow"
module = "Conv"
repeat = 1
from = [-1]
args.in_channels = 512
args.out_channels = 512
args.kernel_size = 3
args.stride = 2

[[network]]
# 24 cat head P5
type = "flow"
module = "Concat"
repeat = 1
from = [-1, 10]

[[network]]
# 25 (P5/32-large)
type = "flow"
module = "C3"
repeat = 3
from = [-1]
args.in_channels = 1024
args.out_channels = 1024
args.shortcut = false

[[network]]
# 26
type = "flow"
module = "Combine"
repeat = 1
from = [19, 22, 25]

[[network]]
# 27 Detect(P3, P4, P5)
type = "head"
module = "YOLODetect"
repeat = 1
from = [-1]
args.nc = -1
args.from_channels = [256, 512, 1024]