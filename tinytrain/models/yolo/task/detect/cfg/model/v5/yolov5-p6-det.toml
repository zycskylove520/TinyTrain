width = 1.00
summary = "941 layers, 101828248 parameters, 101828248 gradients, 163.73 GFLOPs, for a 640×640 input."

[scales.x]
depth = 1.33
width = 1.25
summary = "1193 layers, 196993720 parameters, 196993720 gradients, 321.34 GFLOPs, for a 640×640 input."

