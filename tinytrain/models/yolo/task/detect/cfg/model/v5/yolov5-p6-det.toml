name = "YOLOv5-p6-det"
scale = "n"

# model_config compound scaling constants
[scales.n]
depth = 0.33
width = 0.25
summary = "500 layers, 4485112 parameters, 4485112 gradients, 7.14 GFLOPs, for a 640×640 input."

[scales.s]
depth = 0.33
width = 0.50
summary = "500 layers, 16638680 parameters, 16638680 gradients, 23.8 GFLOPs, for a 640×640 input."

[scales.m]
