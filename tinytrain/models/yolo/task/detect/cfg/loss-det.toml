# =====================
# YOLO目标检测loss配置文件
# =====================

cls_loss_gain = 0.5
# 分类损失权重：放大或缩小分类 loss 对总梯度的贡献，0.5 表示最终分类 loss ×0.5

box_loss_gain = 7.5
# 边界框回归损失权重：提高框位置精度在训练中的重要性，7.5 表示框 loss ×7.5

dfl_loss_gain = 1.5
# Distribution Focal Loss（分布焦点损失）权重：用于更精细的框定位，1.5 表示 dfl loss ×1.5

distill_loss_gain = 1.0
# 模型蒸馏损失权重：控制教师模型对学生模型的知识传递强度
# 1.0 表示与原始任务损失同等重要，平衡知识蒸馏和直接监督

distill_temperature = 2.0
# 蒸馏温度参数：控制教师模型输出分布的平滑程度
# 较高的温度（>1.0）产生更平滑的概率分布，便于学生模型学习
# 典型范围：1.0-5.0，2.0 是常用起始值