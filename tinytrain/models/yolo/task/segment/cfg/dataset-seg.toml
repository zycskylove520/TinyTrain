# ========================
# YOLO实例分割dataset配置文件
# ========================

img_size = 640
# 输入图像的尺寸，模型将图像缩放到这个大小进行处理

cache = false
# 是否使用缓存，设置为 false 表示不使用缓存

train = "datasets/xxx/images/train"
# 训练集图像路径

val = "datasets/xxx/images/val"
# 验证集图像路径

segment_resamples = 1000
# 对分割标签进行重采样时的采样点数。数值越大，轮廓越平滑，但会增加内存与计算开销

overlap_mask = true
# 是否允许不同实例的掩码重叠。分割任务中，若多人重叠区域较多，建议设为 true

mask_ratio = 4
# 掩码下采样比例（相对于输入图像）。最终掩码分辨率为 img_size // mask_ratio，可显著减少显存占用

nc = 1
# 数据集的类别数量

# 类别名称
[names]
0 = "人"
