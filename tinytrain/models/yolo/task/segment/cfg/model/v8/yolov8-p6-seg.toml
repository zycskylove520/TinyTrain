repeat = 3
from = [-1]
args.in_channels = 768
args.out_channels = 768
args.shortcut = true

[[network]]
# 9-P6/64
type = "flow"
module = "CBA"
repeat = 1
from = [-1]
args.in_channels = 768
args.out_channels = 1024
args.kernel_size = 3
args.stride = 2

[[network]]
# 10
type = "flow"
module = "C2f"
repeat = 3
from = [-1]
args.in_channels = 1024
args.out_channels = 1024
args.shortcut = true

[[network]]
# 11
