module = "SPPF"
repeat = 1
from = [-1]
args.in_channels = 1024
args.out_channels = 1024
args.kernel_size = 5

# ----------------------------------head--------------------------------------
[[network]]
# 12
type = "flow"
module = "torch.nn.Upsample"
repeat = 1
from = [-1]
args.scale_factor = 2
args.mode = "nearest"

[[network]]
# 13 cat backbone P5
type = "flow"
module = "Concat"
repeat = 1
from = [-1, 8]

[[network]]
# 14
type = "flow"
module = "C2"
repeat = 1
