# =======================================
# YOLO实例分割模型: YOLOv8-p6-seg 模型配置文件
# =======================================

name = "YOLOv8-p6-seg"
scale = "n"

# model_config compound scaling constants
[scales.n]
depth = 0.33
width = 0.25
summary = "467 layers, 6150260 parameters, 6150260 gradients, 10.44 GFLOPs, for a 640×640 input."

[scales.s]
depth = 0.33
width = 0.50
summary = "467 layers, 21850180 parameters, 21850180 gradients, 33.01 GFLOPs, for a 640×640 input."

[scales.m]
depth = 0.67
width = 0.75
summary = "575 layers, 56585428 parameters, 56585428 gradients, 88.62 GFLOPs, for a 640×640 input."

[scales.l]
depth = 1.00
width = 1.00
summary = "776 layers, 133744612 parameters, 133744612 gradients, 211.83 GFLOPs, for a 640×640 input."

[scales.x]
depth = 1.00
width = 1.25
summary = "776 layers, 208551988 parameters, 208551988 gradients, 329.61 GFLOPs, for a 640×640 input."

# ----------------------------backbone---------------------------------
[[network]]
# 0-P1/2
type = "entry"
module = "CBA"
repeat = 1
from = [-1]
args.in_channels = 3
args.out_channels = 64
args.kernel_size = 3
args.stride = 2

[[network]]
# 1-P2/4
type = "flow"
module = "CBA"
repeat = 1
from = [-1]
args.in_channels = 64
args.out_channels = 128
args.kernel_size = 3
args.stride = 2

[[network]]
# 2
type = "flow"
module = "C2f"
repeat = 3
from = [-1]
args.in_channels = 128
args.out_channels = 128
args.shortcut = true

[[network]]
# 3-P3/8
type = "flow"
module = "CBA"
repeat = 1
from = [-1]
args.in_channels = 128
args.out_channels = 256
args.kernel_size = 3
args.stride = 2

[[network]]
# 4
type = "flow"
module = "C2f"
repeat = 6
from = [-1]
args.in_channels = 256
args.out_channels = 256
args.shortcut = true

[[network]]
# 5-P4/16
type = "flow"
module = "CBA"
repeat = 1
from = [-1]
args.in_channels = 256
args.out_channels = 512
args.kernel_size = 3
args.stride = 2

[[network]]
# 6
