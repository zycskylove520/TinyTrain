# =====================
# YOLO姿态估计loss配置文件
# =====================

cls_loss_gain = 0.5
# 分类损失权重，用于平衡分类任务在总损失中的占比，值为 0.5

box_loss_gain = 7.5
# 边界框回归损失权重，用于调整边界框预测任务在总损失中的比重，值为 7.5

dfl_loss_gain = 1.5
# 分布式焦点损失权重，通常用于目标检测中的分类分支，值为 1.5

seg_loss_gain = 7.5
# 分割损失权重，用于实例分割任务在总损失中的权重，值为 7.5

num_masks = 32
# 分割头输出的“掩膜系数”通道数.
# 每个 anchor 会预测 num_masks 个系数，与原型图线性组合后生成最终掩码。
# 数值越大，可表示的实例掩码越精细，但会增加检测头参数量与显存占用；
# 通常 32 已能满足 COCO 多人场景，若实例更复杂可尝试 64。

num_protos = 256
# 原型图（prototypes）通道数.
# Proto 分支会生成 num_protos 张原型图，每张图分辨率与当前特征图相同。
# 最终掩码 = Σ(掩膜系数_i * 原型图_i)。增大该值可提升掩码细节表达能力，
# 但会使 Proto 模块计算量线性增加；除非 mAP 出现明显下降，否则保持默认 256 即可。